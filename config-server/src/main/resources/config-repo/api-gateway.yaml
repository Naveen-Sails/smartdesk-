server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartdesk_auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:2004}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

ticket:
  service:
    url: ${TICKET_SERVICE_URL:http://127.0.0.1:8081}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8083}

ai:
  triage:
    service:
      url: ${AI_TRIAGE_SERVICE_URL:http://127.0.0.1:8084}
