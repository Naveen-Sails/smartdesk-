openapi: 3.0.3
info:
  title: SmartDesk Microservices & Gateway API
  description: >
    API specification for the SmartDesk microservices platform, covering the
    API Gateway (Auth & Routing), Notification Service, and Downstream Ticket Service.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: SmartDesk API Gateway (Local Development)

tags:
  - name: Authentication (OTP)
    description: Passwordless two-step OTP authentication and JWT token generation
  - name: Tickets
    description: Ticket management endpoints proxied to the downstream ticket service
  - name: Notifications
    description: Email notification dispatch and delivery logs

paths:
  /api/v1/auth/otp/request:
    post:
      tags:
        - Authentication (OTP)
      summary: Request a 6-digit login verification OTP
      description: >
        Initiates OTP generation for registered and active users. Protected against
        email enumeration (returns generic 200 even if email not found) and rate-limited to 1 request per 60 seconds.
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestDTO'
      responses:
        '200':
          description: Generic confirmation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                message: "If an account exists with this email, a verification code has been sent."
                status: 200
                timestamp: "2026-11-13T16:00:00"
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (cooldown active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 429
                error: "Too Many Requests"
                message: "Please wait 45 seconds before requesting another OTP."
                timestamp: "2026-11-13T16:00:15"

  /api/v1/auth/otp/verify:
    post:
      tags:
        - Authentication (OTP)
      summary: Verify OTP and receive JWT access token
      description: >
        Validates the 6-digit OTP against the BCrypt hash. Locks code after 3 failed attempts.
        On success, returns a signed 24-hour Bearer JWT with user profile details.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyDTO'
      responses:
        '200':
          description: OTP verified successfully; JWT generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error (e.g. OTP not 6 digits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid OTP, code expired, or attempt limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                error: "Unauthorized"
                message: "Invalid OTP. Attempts remaining: 2"
                timestamp: "2026-11-13T16:01:00"

  /api/v1/auth/register/request:
    post:
      tags:
        - Authentication (OTP)
      summary: Request registration activation OTP for new user
      description: >
        Creates a pending-activation user (isActive = false) or updates an inactive user record,
        generates a 6-digit OTP, and dispatches it via email. Rejects if user is already active.
      operationId: requestRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDTO'
      responses:
        '200':
          description: Registration OTP dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                message: "Verification code sent to your email."
                status: 200
                timestamp: "2026-11-13T16:00:00"
        '400':
          description: Account already exists or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit cooldown active

  /api/v1/auth/register/verify:
    post:
      tags:
        - Authentication (OTP)
      summary: Verify registration OTP and activate user account
      description: >
        Validates the 6-digit registration OTP, sets isActive = true on the user record,
        and generates a 24-hour Bearer JWT token.
      operationId: verifyRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyDTO'
      responses:
        '200':
          description: Registration verified, user activated, and JWT generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid or expired verification code

  /api/v1/tickets:
    get:
      tags:
        - Tickets
      summary: List support tickets
      description: Proxied by API Gateway to ticket-service. Requires valid Bearer JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Open, In progress, Waiting on employee, Resolved, Closed]
        - name: department
          in: query
          required: false
          schema:
            type: string
            enum: [IT, HR, Facilities, Java, Dotnet, AI]
      responses:
        '200':
          description: List of tickets matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDTO'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Tickets
      summary: Create a support ticket
      description: Creates a new support ticket. Gateway injects user identity headers.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDTO'
      responses:
        '201':
          description: Ticket successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDTO'
        '400':
          description: Validation failure
        '401':
          description: Unauthorized

  /api/v1/tickets/{ticketId}:
    get:
      tags:
        - Tickets
      summary: Get ticket details and activity history
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket details with full activity timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailDTO'
        '401':
          description: Unauthorized
        '404':
          description: Ticket not found

    patch:
      tags:
        - Tickets
      summary: Update ticket status or assignee
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketDTO'
      responses:
        '200':
          description: Ticket successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDTO'

  /api/v1/tickets/{ticketId}/comments:
    post:
      tags:
        - Tickets
      summary: Add a comment/reply to a ticket thread
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Comment successfully posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailDTO'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OtpRequestDTO:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "employee@smartdesk.com"

    OtpVerifyDTO:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: "employee@smartdesk.com"
        otp:
          type: string
          pattern: '^\d{6}$'
          example: "123456"

    ApiResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time

    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: "Maya Chen"
        email:
          type: string
          format: email
          example: "employee@smartdesk.com"
        role:
          type: string
          enum: [ROLE_EMPLOYEE, ROLE_AGENT, ROLE_MANAGER, ROLE_ADMIN]
        department:
          type: string
          example: "IT"
        isRootAdmin:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserDTO'

    CreateTicketDTO:
      type: object
      required:
        - title
        - description
        - department
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 3000
        department:
          type: string
          enum: [IT, HR, Facilities, Java, Dotnet, AI]
        category:
          type: string
        priority:
          type: string
          enum: [Low, Medium, High]
        summary:
          type: string

    UpdateTicketDTO:
      type: object
      properties:
        status:
          type: string
          enum: [Open, In progress, Waiting on employee, Resolved, Closed]
        assignee:
          type: string

    TicketDTO:
      type: object
      properties:
        id:
          type: string
          example: "SD-1049"
        title:
          type: string
        description:
          type: string
        department:
          type: string
        category:
          type: string
        priority:
          type: string
        status:
          type: string
        requester:
          type: string
        requesterEmail:
          type: string
        assignee:
          type: string
          nullable: true
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketDetailDTO:
      allOf:
        - $ref: '#/components/schemas/TicketDTO'
        - type: object
          properties:
            activity:
              type: array
              items:
                type: object
                properties:
                  author:
                    type: string
                  message:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  kind:
                    type: string
                    enum: [created, status, assignment, comment]

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties:
            type: string
