server:
  port: ${PORT:8084}

spring:
  application:
    name: ai-triage-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://127.0.0.1:8888}"
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 15000

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka/}

groq:
  api:
    key: ${GROQ_API_KEY:mock-key}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_API_MODEL:openai/gpt-oss-20b}
